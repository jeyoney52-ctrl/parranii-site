<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파르라니 관리">
<meta name="robots" content="noindex">
<title>파르라니 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="login" class="login" hidden>
  <img src="icon-192.png" alt="" class="login-logo">
  <h1>파르라니 관리</h1>
  <form id="login-form">
    <input type="password" name="pass" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
    <button type="submit">들어가기</button>
    <p class="msg" id="login-msg" aria-live="polite"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="ttl"><img src="icon-192.png" alt=""><b>파르라니 관리</b></div>
    <button type="button" id="refresh" class="icon" aria-label="새로고침">↻</button>
  </header>

  <section class="quick">
    <a class="q" href="https://claude.ai/artifact/2LBF5iCfRSWjPWF6aK1n4E#admin" target="_blank" rel="noopener"><span>✏️</span>작품 · 소식 고치기</a>
    <a class="q" href="https://parranii.com" target="_blank" rel="noopener"><span>🖼</span>parranii.com 보기</a>
    <button type="button" class="q" id="bell"><span>🔔</span><em id="bell-t">알림 켜기</em></button>
  </section>
  <p class="hint" id="bell-hint" hidden></p>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="inq" aria-selected="true">문의 <i id="n-inq" hidden></i></button>
    <button type="button" role="tab" data-tab="gb" aria-selected="false">방명록 <i id="n-gb" hidden></i></button>
  </nav>
  <p class="note" id="note" aria-live="polite"></p>
  <section id="list" class="list"></section>
  <footer class="foot"><button type="button" id="logout" class="link">로그아웃</button> · <button type="button" id="test" class="link">알림 테스트</button></footer>
</div>

<script src="ava.js"></script>
<script src="app.js"></script>
</body>
</html>
