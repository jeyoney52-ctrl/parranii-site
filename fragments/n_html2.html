<!-- ───────── 재료별 전시 상세 / 첫 화면 포스터 크게 보기 ───────── -->
<div class="pzd" id="pzd" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="pzd-t">
  <button class="pzd-x" type="button" id="pzd-x">Close</button>
  <div class="pzd-in">
    <div class="pzd-left"><img id="pzd-img" alt=""></div>
    <div class="pzd-right"><div class="pzd-head"><span class="k" id="pzd-k"></span><h3 id="pzd-t"></h3><p id="pzd-d"></p></div><div class="pzd-grid" id="pzd-grid"></div></div>
  </div>
</div>
<div class="pv" id="pv" role="dialog" aria-modal="true" aria-hidden="true" aria-label="전시 포스터">
  <button class="pv-btn pv-x" type="button" id="pv-x">Close</button>
  <div class="pv-img"><img id="pv-img" alt=""></div>
  <div class="pv-info"><span class="k" id="pv-k"></span><h3 id="pv-t"></h3><p id="pv-s"></p><div class="pv-nav"><button class="pv-btn" type="button" id="pv-p">Prev</button><button class="pv-btn" type="button" id="pv-n">Next</button></div></div>
</div>
