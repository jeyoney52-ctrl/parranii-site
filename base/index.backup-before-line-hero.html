<title>Gallery Parranii</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Italiana&display=swap">
<style>
/* Layout: 검은 화면 손전등 → 아이의 책이 커지며 펼쳐지고 물감이 번지는 인트로 → 회전 카드 / 우표 콜라주 → 한 점씩 크게 보는 전시실, 오른쪽엔 계단을 오르내리는 아이 */
:root {
  --paper: #f8f8f5;      /* 전시실 벽 */
  --ink: #1f1d2b;        /* 먹빛 남색 */
  --mute: #6d6b7b;       /* 캡션 회색 (남색 기운) */
  --cobalt: #2c3ea0;     /* 작품 속 코발트 */
  --night: #0a0a0d;      /* 인트로 어둠 */
  --chalk: #f1ede4;      /* 어둠 속 선 */
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-latin: "Italiana", "Didot", "Bodoni 72", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; }

/* ───────── 인트로: 선으로 그린 아이가 책을 펼치고 넘기는 모션그래픽 ───────── */
.intro {
  position: relative; height: 100vh; height: 100svh; min-height: 560px;
  overflow: hidden; background: #fbfaf6;
}
.paper-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.figure {
  position: absolute; left: 50%; top: 44%; width: min(96vw, 84vh); aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(var(--cam, 1));
  transform-origin: 44.7% 50%; overflow: visible; pointer-events: none;
  --line: #f3e9d6; --pagefill: #000;
  -webkit-mask: radial-gradient(circle var(--fr, 0px) at var(--fmx, 50%) var(--fmy, 50%), #000 40%, transparent 100%);
          mask: radial-gradient(circle var(--fr, 0px) at var(--fmx, 50%) var(--fmy, 50%), #000 40%, transparent 100%);
  filter: drop-shadow(0 0 2px rgba(255,236,200,.55)) drop-shadow(0 0 10px rgba(255,226,180,.18));
  transition: filter 1.6s ease;
}
.figure .ln { fill: none; stroke: var(--line); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke 1.6s ease; }
.figure .pg { fill: var(--pagefill); transition: fill .6s ease; }
.figure .ink { fill: var(--line); transition: fill 1.6s ease; }
.figure .tints { mix-blend-mode: multiply; }
.intro.fillpaper .figure { --pagefill: #fbfaf6; }
.intro.paper .figure { --line: #2a2833; --pagefill: #fbfaf6; filter: blur(var(--blur, 0px)); }
.intro.lit .figure { -webkit-mask: none; mask: none; }
.haze {
  position: absolute; inset: 0; pointer-events: none;
  background: rgba(251,250,246,var(--ha, 0));
  -webkit-backdrop-filter: blur(var(--hb, 0px)); backdrop-filter: blur(var(--hb, 0px));
}

.title {
  position: absolute; left: 0; right: 0; bottom: 6vh; z-index: 3; text-align: center;
  display: grid; gap: 8px; justify-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; transform: translateY(14px) scale(.985); filter: blur(14px);
  transition: opacity 2s ease, transform 2.2s cubic-bezier(.2,.7,.2,1), filter 2s ease;
}
.intro.titled .title { opacity: 1; transform: none; filter: blur(0); }
.title .mark { position: relative; display: inline-block; }
.drops { position: absolute; inset: -60% -18%; width: 136%; height: 220%; z-index: -1; overflow: visible; pointer-events: none; mix-blend-mode: multiply; }
.drop { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; }
.intro.bright .drop { animation: plop 2.6s cubic-bezier(.2,.9,.3,1) forwards; }
.intro.bright .drop.d1 { animation-delay: 1.5s; }
.intro.bright .drop.d2 { animation-delay: 2s; }
/* 톡 떨어진 뒤 종이에 천천히 번진다 */
@keyframes plop { 0% { transform: scale(0); opacity: 0; } 12% { transform: scale(.7); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.title .wordmark {
  font-family: var(--font-latin); font-size: clamp(40px, 7.5vw, 84px);
  line-height: 1; letter-spacing: .04em; color: var(--ink); margin: 0;
}
.title .tagline { font-family: var(--font-display); font-size: clamp(15px, 2vw, 20px); color: var(--ink); margin: 0; letter-spacing: .02em; }
.hint {
  position: absolute; z-index: 3; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 12px; letter-spacing: .2em; color: var(--mute); opacity: 0; transition: opacity .8s ease; white-space: nowrap;
}
.skip {
  position: absolute; z-index: 4; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  background: none; border: 1px solid rgba(241,237,228,.3); color: rgba(241,237,228,.7); cursor: pointer;
  font-size: 12px; letter-spacing: .14em; padding: 6px 12px; border-radius: 999px;
}
.intro.titled .skip { display: none; }
.intro.paper .skip { border-color: rgba(35,33,47,.3); color: var(--mute); }

/* ───────── 공통 섹션 ───────── */
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(150px, env(safe-area-inset-right, 0px));
  padding-block: 96px;
  max-width: 1280px; margin: 0 auto;
}
.wrap.first { padding-left: max(150px, env(safe-area-inset-left, 0px)); }
@media (max-width: 720px) { .wrap.first { padding-left: max(14px, env(safe-area-inset-left, 0px)); } }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; margin-bottom: 40px; }
.sec-head h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 3.4vw, 34px); margin: 0; text-wrap: balance; }
.sec-head p { margin: 4px 0 0; color: var(--mute); font-size: 14px; }
.eyebrow { font-family: var(--font-latin); font-size: 15px; letter-spacing: .18em; color: var(--cobalt); text-transform: uppercase; }

.switch { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; padding: 3px; }
.switch button {
  background: none; border: 0; padding: 6px 16px; border-radius: 999px; cursor: pointer;
  font-size: 13px; letter-spacing: .06em;
}
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ───────── 회전 카드: 타원 궤도를 도는 유리 카드, 뒤로 돌아가며 흐려진다 ───────── */
.ring-view {
  position: relative; height: clamp(420px, 54vw, 580px); touch-action: pan-y; cursor: grab;
  user-select: none; -webkit-user-select: none; overflow: hidden;
  -webkit-mask: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
}
.ring-view::before { /* 유리 너머로 비치는 작품 빛깔 */
  content: ""; position: absolute; inset: 8% 6%; border-radius: 50%; pointer-events: none;
  background:
    radial-gradient(closest-side at 22% 55%, rgba(236,120,158,.55), transparent),
    radial-gradient(closest-side at 50% 40%, rgba(44,62,160,.40), transparent),
    radial-gradient(closest-side at 78% 58%, rgba(246,196,64,.50), transparent),
    radial-gradient(closest-side at 50% 80%, rgba(64,190,200,.35), transparent);
  filter: blur(50px); opacity: .8;
}
.ring-view.grabbing { cursor: grabbing; }
.ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.card {
  position: absolute; width: var(--cw); height: calc(var(--cw) * 1.32);
  left: calc(var(--cw) / -2); top: calc(var(--cw) * -0.66);
  padding: 10px 10px 36px; border-radius: 18px; cursor: pointer; display: block; overflow: hidden;
  background: linear-gradient(150deg, rgba(255,255,255,.55), rgba(255,255,255,.18));
  border: 1px solid rgba(255,255,255,.75);
  -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25), 0 24px 48px -24px rgba(31,29,43,.45);
  will-change: transform, filter, opacity;
}
.card::after { /* 유리 위로 미끄러지는 빛 */
  content: ""; position: absolute; inset: -40%; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.55) 48%, transparent 58%);
  transform: translateX(var(--sheen, 0%));
}
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; border-radius: 10px; opacity: var(--io, 1); }
.card span {
  position: absolute; left: 14px; right: 14px; bottom: 10px;
  font-family: var(--font-display); font-size: 12.5px; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink);
}

.album[hidden], .ring-wrap[hidden] { display: none; }

/* ───────── 우표첩: 한 장에 몇 장씩, 한 장씩 넘겨 본다 ───────── */
.album { display: grid; gap: 4px; }
.alb-sheet { position: relative; background: #fff; border: 1px solid #e8e6ec; border-radius: 6px; padding: clamp(18px, 3vw, 36px) clamp(14px, 3vw, 36px) 50px; box-shadow: 0 22px 40px -28px rgba(31,29,43,.35), inset 0 0 0 6px #fbfaf6; }
.alb-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: clamp(22px, 3vw, 40px) clamp(12px, 2.4vw, 30px); }
.alb-stamp { border: 0; padding: 0; background: none; cursor: pointer; min-width: 0; text-align: center; transform: rotate(var(--rot, 0deg)) translateY(var(--dy, 0px)); transition: transform .35s ease; filter: drop-shadow(0 8px 12px rgba(31,29,43,.22)); }
.alb-stamp:hover, .alb-stamp:focus-visible { transform: rotate(0deg) translateY(-6px) scale(1.04); z-index: 2; }
.alb-stamp .stamp-paper { padding: 10px 10px 28px; }
.alb-stamp .stamp-paper img { aspect-ratio: 4 / 5; object-fit: contain; background: #f3f2ee; }
.alb-no { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: var(--font-latin); font-size: 13px; letter-spacing: .24em; color: var(--mute); }
.alb-empty { grid-column: 1 / -1; padding: 40px 12px; text-align: center; color: var(--mute); }

/* 카드 넘기기·우표첩 공통 컨트롤 */
.cf-cap { margin: 4px 0 0; text-align: center; min-height: 3.2em; }
.cf-cap em { display: block; font-style: normal; font-family: var(--font-latin); font-size: 13px; letter-spacing: .2em; color: var(--cobalt); }
.cf-cap b { font-family: var(--font-display); font-weight: 400; font-size: clamp(17px, 2.2vw, 22px); }
.cf-cap span { display: block; font-size: 13px; color: var(--mute); }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; margin-top: 14px; }
.pager button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ink); background: none; cursor: pointer; font-size: 18px; flex: none; }
.pager button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.pager button:disabled { opacity: .3; cursor: default; }
.pager input[type=range] { width: min(380px, 44vw); accent-color: var(--ink); }
.pager output { font-size: 13px; color: var(--mute); min-width: 8ch; text-align: center; font-variant-numeric: tabular-nums; }
.pg-find { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
.pg-find input { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid #dddbe3; border-radius: 8px; padding: 6px 10px; width: min(150px, 34vw); min-width: 0; }
.ring-view:focus-visible { outline-offset: -4px; }
@media (max-width: 720px) { .pager input[type=range] { width: 38vw; } .pg-find { flex: 1 1 100%; justify-content: center; } }

.stamp-paper {
  display: block; background: #fff; padding: 12px 12px 30px; position: relative;
  -webkit-mask: radial-gradient(circle at center, transparent 4px, #000 4.6px) -6px -6px / 12px 12px round,
                linear-gradient(#000 0 0) 6px 6px / calc(100% - 12px) calc(100% - 12px) no-repeat;
          mask: radial-gradient(circle at center, transparent 4px, #000 4.6px) -6px -6px / 12px 12px round,
                linear-gradient(#000 0 0) 6px 6px / calc(100% - 12px) calc(100% - 12px) no-repeat;
}
.stamp-paper img { display: block; width: 100%; }
.stamp-paper b {
  position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; justify-content: space-between; gap: 8px;
  font-weight: 400; font-size: 10px; letter-spacing: .1em; color: var(--ink); white-space: nowrap;
}
.stamp-paper b em { font-style: normal; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-display); letter-spacing: 0; }
.stamp-paper b small { font-family: var(--font-latin); font-size: 11px; color: var(--cobalt); }
.postmark {
  position: absolute; right: -10px; top: -14px; width: 74px; height: 74px; border-radius: 50%;
  border: 1.5px solid rgba(44,62,160,.55); display: grid; place-items: center; transform: rotate(-18deg);
  font-family: var(--font-latin); font-size: 10px; letter-spacing: .14em; color: rgba(44,62,160,.7); pointer-events: none;
  text-align: center; line-height: 1.2;
}

/* ───────── 전시실 ───────── */
.works { display: grid; gap: clamp(64px, 10vw, 130px); }
.xf { display: grid; gap: 12px; margin: -12px 0 clamp(36px, 6vw, 64px); }
.xf-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.xf-all { font-family: var(--font-latin); font-size: 15px; letter-spacing: .14em; padding: 4px 18px; border-radius: 999px; border: 1px solid var(--ink); background: none; cursor: pointer; }
.xf-all[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.xf-find { flex: 1 1 220px; max-width: 340px; }
.xf-find input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid #dddbe3; border-radius: 999px; padding: 7px 16px; }
.work .no { font-family: var(--font-latin); font-size: 13px; letter-spacing: .14em; color: var(--cobalt); }
.xf-sort { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; color: var(--mute); margin-left: auto; }
.xf-sort select { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid #dddbe3; border-radius: 8px; padding: 6px 10px; }
.xf-count { margin: 0; flex: 1 1 100%; font-size: 13px; color: var(--mute); }
.xf-count b { font-family: var(--font-display); font-size: 20px; color: var(--ink); margin-right: 2px; }
.xf-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
.xf-row > b { flex: none; width: 3.6em; font-weight: 400; font-size: 12px; letter-spacing: .16em; color: var(--mute); }
.xf-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.xf-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; font-size: 13px; border: 1px solid #cfcdd6; border-radius: 999px; background: none; cursor: pointer; white-space: nowrap; }
.xf-chip small { color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }
.xf-chip i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(31,29,43,.18); }
.xf-chip:hover { border-color: var(--ink); }
.xf-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.xf-chip[aria-pressed="true"] small { color: rgba(248,248,245,.75); }
.xf-note { font-size: 12px; color: var(--mute); }
.xf-active { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed #cfcdd6; border-radius: 12px; }
.xf-active[hidden] { display: none; }
.xf-active > b { flex: none; font-weight: 400; font-size: 12px; letter-spacing: .14em; color: var(--mute); margin-right: 2px; }
.xf-tag { display: inline-flex; align-items: center; gap: 7px; padding: 3px 6px 3px 12px; font-size: 13px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--paper); cursor: pointer; }
.xf-tag em { font-style: normal; font-size: 11px; opacity: .7; letter-spacing: .06em; }
.xf-tag i { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(248,248,245,.6); }
.xf-tag span { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(248,248,245,.18); font-size: 13px; line-height: 1; }
.xf-tag:hover span { background: rgba(248,248,245,.4); }
.xf-clear { background: none; border: 0; border-bottom: 1px solid var(--mute); padding: 0; margin-left: 4px; font-size: 12px; color: var(--mute); cursor: pointer; }
.xf-view { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; }
.xf-view button { font: inherit; font-size: 13px; letter-spacing: .08em; padding: 5px 16px; background: none; border: 0; color: var(--ink); cursor: pointer; }
.xf-view button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.works.grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 34px 20px; align-items: start; }
.gitem { margin: 0; min-width: 0; }
.gitem figure { margin: 0; cursor: zoom-in; aspect-ratio: 1; display: grid; place-items: center; background: #efeee9; overflow: hidden; }
.gitem img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; transition: transform .5s ease; }
.gitem figure:hover img { transform: scale(1.04); }
.gitem p { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
.gitem .no { display: block; font-family: var(--font-latin); font-size: 12px; letter-spacing: .14em; color: var(--cobalt); }
.xf-sentinel { height: 1px; }
@media (max-width: 720px) { .works.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; } }
.xf-more { display: block; margin: clamp(48px, 7vw, 80px) auto 0; background: none; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 30px; cursor: pointer; font-size: 14px; }
.xf-more:hover { background: var(--ink); color: var(--paper); }
.xf-more[hidden] { display: none; }
.xf-empty { padding: 48px 16px; text-align: center; color: var(--mute); border: 1px dashed #d9d7df; border-radius: 12px; }
.work { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 32px; align-items: end; }
.work:nth-child(even) { grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); }
.work:nth-child(even) figure { order: 2; }
.work figure { margin: 0; cursor: zoom-in; }
.work img {
  display: block; max-width: 100%; max-height: 82vh; width: auto; margin-inline: auto;
  box-shadow: 0 30px 60px -30px rgba(31,29,43,.4);
  transform: translateY(26px) scale(.98); opacity: .4;
  transition: transform 1.1s cubic-bezier(.2,.7,.2,1), opacity 1.1s ease;
}
.work.seen img { transform: none; opacity: 1; }
.cap { display: grid; gap: 10px; min-width: 0; }
.cap h3 { font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.35; margin: 0; text-wrap: balance; }
.cap dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; color: var(--mute); }
.cap dt { letter-spacing: .1em; }
.cap dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }

footer { text-align: center; color: var(--mute); font-size: 13px; }
footer .wordmark { font-family: var(--font-latin); font-size: 34px; color: var(--ink); display: block; letter-spacing: .04em; }
footer .admin-link { display: inline-block; margin-top: 18px; font-size: 12px; letter-spacing: .14em; color: var(--mute); }
.lb-text p { white-space: pre-line; }
.work .desc { grid-row: 2; grid-column: 1; margin: 0; max-width: 60ch; justify-self: center; font-size: 14px; line-height: 1.8; color: var(--ink); white-space: pre-line; overflow-wrap: anywhere; }
.work:nth-child(even) .desc { grid-column: 2; }
@media (max-width: 640px) {
  .work, .work:nth-child(even) { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .work:nth-child(even) figure { order: 0; }
  .work .desc, .work:nth-child(even) .desc { grid-column: 1; grid-row: auto; }
}

/* ───────── 관리자 페이지 (#admin) ───────── */
body.admin > :not(#admin):not(script):not(style) { display: none !important; }
body.admin { overflow: auto !important; }
#admin {
  min-height: 100vh; background: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 80px;
}
.adm { max-width: 960px; margin: 0 auto; display: grid; gap: 24px; }

  // 실 부분은 빠르게, 그림 부분은 천천히 그려지도록 진행 거리에 가중치를 둔다
  const ACC = [0], WACC = [0];
  for (let i = 1; i < ONE.length; i++) { const d = len(sub(ONE[i], ONE[i - 1])); ACC.push(ACC[i - 1] + d); WACC.push(WACC[i - 1] + d * (SLOW[i] ? 1 : .22)); }
  const lineG = mk(fig, "g");
  const one = { el: mk(lineG, "path", { class: "ink" }), w: 4.4, seed: 3.1, closed: false };
  const visLenAt = p => { const target = p * WACC[WACC.length - 1]; let lo = 0, hi = WACC.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (WACC[m] < target) lo = m + 1; else hi = m; } return ACC[lo]; };

  /* ── 물감: 위에서 방울이 무작위로 톡톡 떨어지고, 떨어진 자리마다 번져 색이 쌓인다 ── */
  const defs = fig.querySelector("defs");
  const filt = (id, freq, scale, blur) => { const fl = mk(defs, "filter", { id, x: "-30%", y: "-30%", width: "160%", height: "160%" }); mk(fl, "feTurbulence", { type: "fractalNoise", baseFrequency: freq, numOctaves: 4, seed: 6, result: "n" }); mk(fl, "feDisplacementMap", { in: "SourceGraphic", in2: "n", scale, xChannelSelector: "R", yChannelSelector: "G" }); mk(fl, "feGaussianBlur", { stdDeviation: blur }); };
  filt("blot", ".035", 22, .5); filt("blot-big", ".012", 60, 1.5);
  const paintG = mk(fig, "g", { style: "mix-blend-mode:multiply" });
  fig.insertBefore(paintG, lineG);
  const dropG = mk(fig, "g");
  const REGIONS = [
    { c: "#4a63c8", o: .5,  w: 72,  at: 0,    pts: [[468, 330], [640, 262], [492, 300], [690, 322], [470, 378], [668, 396]] },
    { c: "#ec8fae", o: .46, w: 78,  at: 380,  pts: [[404, 640], [720, 628], [392, 700], [732, 698], [412, 752], [712, 752]] },
    { c: "#f2c14e", o: .46, w: 70,  at: 760,  pts: [[330, 800], [790, 788], [318, 856], [802, 848], [360, 892], [762, 886]] },
    { c: "#f0ad92", o: .38, w: 52,  at: 1080, pts: [[540, 424], [640, 404], [556, 470], [632, 462]] },
    { c: "#f0ad92", o: .3,  w: 44,  at: 1300, pts: [[368, 640], [356, 770], [374, 840]] },
    { c: "#f0ad92", o: .3,  w: 44,  at: 1420, pts: [[748, 640], [760, 770], [744, 840]] },
    { c: "#9fd6da", o: .3,  w: 230, at: 1700, pts: [[-380, 150], [80, 40], [-340, 330], [110, 260]] },
    { c: "#f4b6c8", o: .28, w: 230, at: 1950, pts: [[1150, 120], [1650, 220], [1180, 330], [1640, 400]] },
    { c: "#f7d98f", o: .28, w: 230, at: 2200, pts: [[1120, 1050], [1650, 980], [1150, 1240], [1660, 1200]] },
    { c: "#b9c2f0", o: .26, w: 230, at: 2450, pts: [[-380, 1020], [120, 1110], [-360, 1240], [140, 1260]] },
  ].map((d, k) => {
    const pts = d.pts.map(([x, y]) => P(x, y));
    const hit = mul(pts.reduce((s, q) => add(s, q), P(0, 0)), 1 / pts.length);
    const xs = pts.map(q => q.x), ys = pts.map(q => q.y);
    const rx = (Math.max(...xs) - Math.min(...xs)) / 2 + d.w * .35, ry = (Math.max(...ys) - Math.min(...ys)) / 2 + d.w * .35;
    // 영역 위 아무 곳에나 물감 방울이 톡톡 떨어져, 떨어진 자리마다 번지며 색이 쌓인다
    const rnd = (a, b) => a + Math.random() * (b - a), big = d.w > 150;
    const count = Math.random() < .5 ? 1 : 2; // 색마다 큰 방울 한두 개
    const drops = Array.from({ length: count }, (_, j) => {
      const ang = rnd(0, Math.PI * 2), rr = count === 1 ? rnd(0, .15) : rnd(.25, .45);
      const at = add(hit, P(Math.cos(ang) * rx * rr, Math.sin(ang) * ry * rr));
      const r = (big ? rnd(230, 300) : (rx + ry) / 2 * (count === 1 ? rnd(1, 1.15) : rnd(.8, .95))), op = d.o * rnd(.8, 1);
      const blot = mk(paintG, "circle", { cx: f(at.x), cy: f(at.y), r: 0, fill: d.c, "fill-opacity": op.toFixed(3), stroke: d.c, "stroke-opacity": (op * .9).toFixed(3), "stroke-width": big ? 3 : 2, filter: big ? "url(#blot-big)" : "url(#blot)" });
      const fall = mk(dropG, "ellipse", { cx: f(at.x), cy: -900, rx: 0, ry: 0, fill: d.c, "fill-opacity": .85 });
      const splash = Array.from({ length: 4 }, () => ({ a: rnd(0, Math.PI * 2), dist: rnd(.6, 1.3), e: mk(dropG, "circle", { r: 0, fill: d.c, "fill-opacity": .65 }) }));
      return { at, r, blot, fall, splash, delay: d.at * 1.25 + j * rnd(450, 750) + rnd(0, 200), size: big ? rnd(24, 32) : rnd(15, 21) };
    });
    return { ...d, drops };
  });

  /* ── 시간표 (ms) ── */
  const T = { draw: [300, 7000], drops: 7400, fall: 1150, spread: 1300, title: 12900, textDrops: 13900, done: 14300 };
  const END = 16000;
  function render(t, now) {
    boil = Math.floor(now / 110); // 초당 9번쯤 선이 다시 그려져 손그림처럼 떨린다
    one.visLen = visLenAt(easeInOutSine(seg(t, ...T.draw)));
    ink(one, ONE);
    REGIONS.forEach(d => d.drops.forEach(p => {
      const t0 = T.drops + p.delay, pf = seg(t, t0, t0 + T.fall), falling = pf > 0 && pf < 1;
      // 위에서 떨어지는 방울 (떨어질수록 길쭉해진다)
      p.fall.setAttribute("cy", f(lerp(-900, p.at.y, pf * (.35 + .65 * pf))));
      p.fall.setAttribute("rx", falling ? f(p.size * .75) : 0); p.fall.setAttribute("ry", falling ? f(p.size * (1 + pf)) : 0);
      // 닿는 순간 톡 튀고, 그 자리에 번진다 (천천히 조금 더 스며든다)
      const q = seg(t, t0 + T.fall, t0 + T.fall + 650);
      p.splash.forEach(sp => {
        const rr = p.r * sp.dist * easeOut(q);
        sp.e.setAttribute("cx", f(p.at.x + Math.cos(sp.a) * rr)); sp.e.setAttribute("cy", f(p.at.y + Math.sin(sp.a) * rr * .8));
        sp.e.setAttribute("r", q > 0 && q < 1 ? f(p.size * .32 * (1 - q)) : 0);
      });
      const g = easeOut(seg(t, t0 + T.fall, t0 + T.fall + T.spread)) * .9 + easeOut(seg(t, t0 + T.fall + 500, t0 + T.fall + 3200)) * .14;
      p.blot.setAttribute("r", f(p.r * g));
    }));
    intro.classList.toggle("titled", t >= T.title);
    intro.classList.toggle("bright", t >= T.textDrops);
    if (t >= T.done && !intro.classList.contains("done")) done();
  }

  /* ── 진행 ── (스크롤은 막지 않는다: 인트로 중에 내리면 인트로를 바로 마무리한다) */
  intro.classList.add("paper", "fillpaper", "lit");
  fig.style.setProperty("--cam", "1.3");
  let start = performance.now() + 600, skipped = false, visible = true;
  function frame(now) {
    if (visible) render(skipped ? END : Math.max(0, now - start), now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  new IntersectionObserver(es => visible = es[0].isIntersecting).observe(intro);
  function done() { intro.classList.add("done"); document.body.classList.remove("locked"); hint.style.opacity = .8; stairs.classList.add("show"); }
  document.getElementById("skip").addEventListener("click", e => { e.stopPropagation(); skipped = true; });
  addEventListener("scroll", () => { if (scrollY > 30 && !intro.classList.contains("done")) skipped = true; }, { passive: true });
  hint.style.opacity = .6; // 처음부터 아래로 내릴 수 있다는 걸 알려 둔다
})();

/* 검색: 숫자(또는 #7, No.7)는 작품 번호, 그 밖에는 제목·재료·연도·설명 */
const workNo = w => WORKS.indexOf(w) + 1;
function workMatch(w, t) {
  t = String(t || "").trim().toLowerCase(); if (!t) return true;
  const m = t.match(/^(?:#|no\.?\s*)?(\d{1,4})$/);
  if (m && (/^(#|no)/.test(t) || t.length <= 3)) { if (workNo(w) === +m[1]) return true; if (/^(#|no)/.test(t)) return false; }
  return [w.title, w.medium, w.year, w.desc].some(v => String(v || "").toLowerCase().includes(t));
}

/* ───────── 확대 보기 (FLIP) ───────── */
const lb = (() => {
  const box = document.getElementById("lightbox"), img = document.getElementById("lb-img");
  const text = document.getElementById("lb-text"), title = document.getElementById("lb-title"), m = document.getElementById("lb-meta");
  let from = null, origin = null;

  function fit(nw, nh) {
    const pad = innerWidth < 600 ? 20 : 60;
    const room = Math.max(innerWidth < 600 ? 150 : 170, Math.ceil(text.offsetHeight) + 56);
    const s = Math.min((innerWidth - pad * 2) / nw, (innerHeight - room - pad) / nh);
    const w = nw * s, h = nh * s;
    return { x: (innerWidth - w) / 2, y: Math.max(pad * .6, (innerHeight - room - h) / 2 + 10), w, h };
  }
  function place(r, base) { img.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / base.w}, ${r.h / base.h})`; }

  let lbToken = 0;
  function open(work, el) {
    origin = el;
    const srcImg = el.querySelector("img") || el;
    const b = srcImg.getBoundingClientRect();
    from = { x: b.left, y: b.top, w: b.width, h: b.height };
    img.onload = null; img.src = work.web || work.src; img.alt = work.title; img.hidden = false;
    if (work.web && work.web !== work.src) { // 원본은 뒤에서 불러와서 같은 자리에서 선명하게 바꾼다
      const full = new Image(), mine = ++lbToken;
      full.onload = () => { if (mine === lbToken && box.classList.contains("on")) img.src = work.src; };
      full.src = work.src;
    }
    title.textContent = work.title; m.textContent = meta(work) || " ";
    const go = () => {
      const to = fit(img.naturalWidth, img.naturalHeight);
      img.style.width = to.w + "px"; img.style.height = to.h + "px";
      img.style.transition = "none"; place(from, to); img.getBoundingClientRect();
      img.style.transition = ""; place(to, to);
      img.dataset.w = to.w; img.dataset.h = to.h;
    };
    img.complete && img.naturalWidth ? go() : (img.onload = go);
    title.textContent = work.title; m.textContent = meta(work) || " ";
    box.classList.add("on"); box.setAttribute("aria-hidden", "false");
    requestAnimationFrame(() => text.classList.add("show"));
    document.body.classList.add("locked");
    document.getElementById("lb-close").focus({ preventScroll: true });
  }
  function close() {
    if (!box.classList.contains("on")) return;
    text.classList.remove("show"); box.classList.remove("on"); box.setAttribute("aria-hidden", "true");
    const b = (origin.querySelector("img") || origin).getBoundingClientRect();
    place({ x: b.left, y: b.top, w: b.width, h: b.height }, { w: +img.dataset.w, h: +img.dataset.h });
    setTimeout(() => { if (!box.classList.contains("on")) img.hidden = true; }, 650);
    document.body.classList.remove("locked");
    origin.focus({ preventScroll: true });
  }
  box.addEventListener("click", close);
  addEventListener("keydown", e => e.key === "Escape" && close());
  return { open };
})();

/* ───────── 카드 넘기기: 가운데 카드를 크게, 양옆은 비스듬히. 수백 점이어도 몇 장만 그려서 겹치지 않는다 ───────── */
const cardFlow = (() => {
  const view = gid("ring-view"), ring = gid("ring"), cap = gid("cf-cap"), range = gid("cf-range"), count = gid("cf-count");
  const prev = gid("cf-prev"), next = gid("cf-next"), qEl = gid("cf-q");
  const nodes = new Map(), KEEP = 6, VIS = 4;
  let pos = 0, target = 0, cw = 220, step = 120, raf = 0, drag = null, dragged = false, touched = false, wheelAcc = 0, onScreen = false, auto = null;
  const N = () => WORKS.length;
  function layout() { const W = view.clientWidth || 600; cw = W < 600 ? Math.min(184, W * .56) : W < 1000 ? 200 : 230; step = cw * .56; view.style.setProperty("--cw", cw + "px"); }
  function ensure(i) {
    if (nodes.has(i)) return nodes.get(i);
    const w = WORKS[i], c = document.createElement("button");
    c.type = "button"; c.className = "card"; c.innerHTML = `<img src="${esc(w.web || w.src)}" alt="" draggable="false"><span>${esc(w.title)}</span>`;
    c.setAttribute("aria-label", `${w.title}${i === target ? " 크게 보기" : " 가운데로 가져오기"}`);
    c.addEventListener("click", () => { if (dragged) return; touched = true; if (i === target) lb.open(WORKS[i], c); else go(i); });
    ring.appendChild(c); nodes.set(i, c); return c;
  }
  function draw() {
    if (!N()) return;
    const lo = Math.max(0, Math.floor(pos) - KEEP), hi = Math.min(N() - 1, Math.ceil(pos) + KEEP);
    for (const [i, el] of nodes) if (i < lo || i > hi) { el.remove(); nodes.delete(i); }
    for (let i = lo; i <= hi; i++) {
      const d = i - pos, a = Math.abs(d), sd = Math.sign(d), el = ensure(i);
      const x = sd * (Math.min(a, 1) * step * 1.4 + Math.max(0, a - 1) * step * .5);
      el.style.transform = `translateX(${x.toFixed(1)}px) scale(${(1 - Math.min(a, 3) * .11).toFixed(3)}) perspective(900px) rotateY(${(-sd * Math.min(a, 1) * 46).toFixed(1)}deg)`;
      el.style.zIndex = 100 - Math.round(a * 10);
      el.style.opacity = a > VIS ? 0 : (1 - Math.max(0, a - 1) * .26).toFixed(2); el.style.pointerEvents = a > VIS ? "none" : "";
      el.style.filter = a > 1 ? `blur(${Math.min(3, (a - 1) * 1.2).toFixed(1)}px)` : "";
      el.style.setProperty("--io", (1 - Math.min(a, 2) * .16).toFixed(2)); el.style.setProperty("--sheen", (d * 40).toFixed(1) + "%");
      el.tabIndex = i === target ? 0 : -1;
    }
  }
  function ui() {
    const w = WORKS[target]; if (!w) { cap.innerHTML = ""; count.textContent = ""; return; }
    cap.innerHTML = `<em>No.${String(target + 1).padStart(2, "0")}</em><b>${esc(w.title)}</b>${meta(w) ? `<span>${esc(meta(w).replace(/\n[\s\S]*/, ""))}</span>` : ""}`;
    count.textContent = `${target + 1} / ${N()}`; range.max = Math.max(0, N() - 1); range.value = target;
    prev.disabled = target <= 0; next.disabled = target >= N() - 1;
    nodes.forEach((el, i) => el.setAttribute("aria-label", `${WORKS[i].title}${i === target ? " 크게 보기" : " 가운데로 가져오기"}`));
  }
  function tick() { const diff = target - pos; if (Math.abs(diff) < .003) { pos = target; draw(); raf = 0; return; } pos += diff * (reduce ? 1 : .17); draw(); raf = requestAnimationFrame(tick); }
  function go(i) { target = clampN(Math.round(i), 0, N() - 1); ui(); if (!raf) raf = requestAnimationFrame(tick); }
  const stop = () => { touched = true; clearInterval(auto); auto = null; };
  function startAuto() { if (reduce || auto || touched) return; auto = setInterval(() => { if (document.hidden || !onScreen || drag) return; go(target >= N() - 1 ? 0 : target + 1); }, 3800); }

  view.addEventListener("pointerdown", e => { if (e.button) return; stop(); drag = { x: e.clientX, pos }; dragged = false; });
  addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x; if (Math.abs(dx) > 6) { dragged = true; view.classList.add("grabbing"); }
    if (!dragged) return;
    pos = clampN(drag.pos - dx / (step * 1.4), 0, N() - 1); target = Math.round(pos); ui(); draw();
  });
  addEventListener("pointerup", () => { if (!drag) return; drag = null; view.classList.remove("grabbing"); if (dragged) { go(pos); setTimeout(() => dragged = false, 60); } });
  view.addEventListener("wheel", e => { if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; e.preventDefault(); stop(); wheelAcc += e.deltaX; if (Math.abs(wheelAcc) > 70) { go(target + Math.sign(wheelAcc)); wheelAcc = 0; } }, { passive: false });
  view.addEventListener("keydown", e => { const k = { ArrowLeft: -1, ArrowRight: 1 }[e.key]; if (k) { e.preventDefault(); stop(); go(target + k); } else if (e.key === "Home") go(0); else if (e.key === "End") go(N() - 1); });
  prev.addEventListener("click", () => { stop(); go(target - 1); }); next.addEventListener("click", () => { stop(); go(target + 1); });
  range.addEventListener("input", () => { stop(); go(+range.value); });
  qEl.addEventListener("input", () => { const t = qEl.value.trim().toLowerCase(); if (!t) return; stop(); const i = WORKS.findIndex(w => workMatch(w, t)); if (i >= 0) go(i); });
  addEventListener("resize", () => { layout(); draw(); });
  if ("IntersectionObserver" in window) new IntersectionObserver(es => { onScreen = es[0].isIntersecting; if (onScreen) startAuto(); }).observe(view); else onScreen = true;
  function render() { layout(); nodes.forEach(el => el.remove()); nodes.clear(); target = clampN(target, 0, Math.max(0, N() - 1)); pos = target; ui(); draw(); }
  onWorks(render);
  return { render };
})();

/* ───────── 우표첩: 한 장에 몇 장씩 붙이고, 한 장씩 넘긴다. 수백 점이면 장 수만 늘어난다 ───────── */
const album = (() => {
  const grid = gid("alb-grid"), no = gid("alb-no"), range = gid("alb-range"), count = gid("alb-count"), sheet = grid.parentElement;
  const prev = gid("alb-prev"), next = gid("alb-next"), qEl = gid("alb-q");
  let page = 0, cols = 4, per = 12;
  const pages = () => Math.max(1, Math.ceil(WORKS.length / per));
  function setCols() { const W = sheet.clientWidth || 800; cols = W < 440 ? 2 : W < 760 ? 3 : 4; per = cols * 3; }
  function show(p, dir) {
    setCols(); const total = pages(); page = clampN(p, 0, total - 1);
    const part = WORKS.slice(page * per, page * per + per);
    grid.style.setProperty("--cols", cols);
    grid.innerHTML = part.map((w, k) => { const i = page * per + k;
      return `<button class="alb-stamp" type="button" data-i="${i}" aria-label="${esc(w.title)} 크게 보기" style="--rot:${((seededN(i) - .5) * 6).toFixed(1)}deg;--dy:${((seededN(i + 5) - .5) * 10).toFixed(0)}px">
        <span class="stamp-paper"><img src="${esc(w.web || w.src)}" alt="" loading="lazy" draggable="false"><b><em>${esc(w.title)}</em><small>${String(i + 1).padStart(2, "0")}</small></b></span>${i % 5 === 0 ? `<span class="postmark">PARRANII<br>2026</span>` : ""}</button>`; }).join("")
      || `<p class="alb-empty">아직 붙여 둔 우표가 없어요.</p>`;
    no.textContent = `— ${page + 1} —`; count.textContent = `${page + 1} / ${total} 장`;
    range.max = total - 1; range.value = page; prev.disabled = page <= 0; next.disabled = page >= total - 1;
    if (dir && !reduce && grid.animate) grid.animate([{ opacity: 0, transform: `translateX(${dir * 60}px) rotate(${dir * 1.4}deg)` }, { opacity: 1, transform: "none" }], { duration: 480, easing: "cubic-bezier(.2,.7,.2,1)" });
  }
  grid.addEventListener("click", e => { const b = e.target.closest(".alb-stamp"); if (b) lb.open(WORKS[+b.dataset.i], b); });
  prev.addEventListener("click", () => show(page - 1, -1)); next.addEventListener("click", () => show(page + 1, 1));
  range.addEventListener("input", () => { const p = +range.value; show(p, p > page ? 1 : -1); });
  qEl.addEventListener("input", () => { const t = qEl.value.trim().toLowerCase(); if (!t) return; const i = WORKS.findIndex(w => workMatch(w, t)); if (i >= 0) show(Math.floor(i / per), Math.floor(i / per) > page ? 1 : -1); });
  gid("album").addEventListener("keydown", e => { if (/INPUT/.test(document.activeElement.tagName)) return; if (e.key === "ArrowRight") show(page + 1, 1); else if (e.key === "ArrowLeft") show(page - 1, -1); });
  let lastCols = 0; addEventListener("resize", () => { if (gid("album").hidden) return; const before = cols; setCols(); if (cols !== before) show(Math.floor(page * (before * 3) / per)); });
  onWorks(() => { if (!gid("album").hidden) show(page); });
  return { show: () => show(page) };
})();

/* ───────── 보기 방식 ───────── */
(() => {
  const btns = { ring: gid("mode-ring"), stamp: gid("mode-stamp") };
  const panes = { ring: gid("ring-wrap"), stamp: gid("album") }, help = gid("browse-help");
  const HELP = {
    ring: "가운데 카드가 지금 보는 작품이에요. 끌거나 화살표로 넘기고, 가운데 카드를 눌러 크게 보세요.",
    stamp: "우표첩을 한 장씩 넘겨 보세요. 한 장에 몇 점씩만 붙어 있고, 누르면 크게 볼 수 있어요.",
  };
  let chosen = false;
  function mode(m, byUser) {
    if (byUser) chosen = true;
    Object.entries(btns).forEach(([k, b]) => b.setAttribute("aria-pressed", k === m));
    Object.entries(panes).forEach(([k, p]) => p.hidden = k !== m);
    help.textContent = HELP[m];
    if (m === "ring") cardFlow.render(); else album.show();
  }
  Object.entries(btns).forEach(([k, b]) => b.addEventListener("click", () => mode(k, true)));
  onWorks(() => { if (!chosen) mode("ring"); });
})();

/* ───────── 전시실: ALL · 연도 · 재료로 좁히고, 정렬하고, 열 점씩 이어서 본다 ───────── */
(() => {
  const list = gid("works"), more = gid("xf-more"), count = gid("xf-count"), sortEl = gid("xf-sort"), allBtn = gid("xf-all");
  const rows = { year: gid("xf-year"), medium: gid("xf-medium") };
  const flt = { year: "", medium: "" }, qx = gid("xf-q");
  let view = "grid";
  const PAGE = () => view === "grid" ? (isNarrow() ? 16 : 30) : (isNarrow() ? 6 : 10);
  let shown = PAGE(), drawn = 0, current = [];
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("seen")), { threshold: .2 });

  /* 재료 묶기: 바탕(종이·캔버스·나무·한지…)은 떼고, 쓴 재료로 묶는다. 캔버스에 과슈·나무에 과슈·아크릴과슈는 모두 ‘과슈’ */
  const SURFACE = /^(종이|캔버스|나무|패널|판넬|합판|천|린넨|광목|벽|한지|장지|화선지|비단|유리|보드|아트지|켄트지|돌|철판)\s*(에|위에|에다)\s*/;
  const MATERIALS = [
    [/과슈|gouache/i, "과슈"], [/오일\s*파스텔|oil\s*pastel/i, "오일파스텔"], [/수채|water\s*colou?r/i, "수채"], [/아크릴|acrylic/i, "아크릴"],
    [/유화|oil\s*(paint|on)/i, "유화"], [/파스텔|pastel/i, "파스텔"], [/색연필/, "색연필"], [/목탄|연필|드로잉|charcoal|pencil/i, "연필·목탄"],
    [/잉크|펜|ink\b|pen\b/i, "잉크·펜"], [/수묵|먹/, "먹"], [/마커|marker/i, "마커"], [/자개/, "자개"], [/콜라주|collage/i, "콜라주"], [/채색/, "채색"],
  ];
  const materialCache = new Map();
  function mediaTokens(v) {
    const raw = String(v || ""); if (materialCache.has(raw)) return materialCache.get(raw);
    const out = new Set();
    raw.split(/[,，·/+&]|\s및\s/).map(x => x.trim()).filter(Boolean).forEach(t => {
      const rest = t.replace(SURFACE, "").trim() || t;
      const hit = MATERIALS.find(([re]) => re.test(rest)); out.add(hit ? hit[1] : rest);
    });
    if (out.size > 1) out.delete("채색");           // ‘채색’만 적힌 작품 말고는, 더 구체적인 재료가 있으면 그쪽으로
    const arr = [...out]; materialCache.set(raw, arr); return arr;
  }
  const NONE = "__none";
  function chip(g, v, label, n, swatch) { return `<button class="xf-chip" type="button" data-g="${g}" data-v="${esc(v)}" aria-pressed="${flt[g] === v}">${swatch ? `<i style="background:${swatch}"></i>` : ""}${esc(label)}<small>${n}</small></button>`; }
  function buildChips() {
    const years = {}, media = {}; let noYear = 0;
    WORKS.forEach(w => { const y = String(w.year || "").trim(); y ? years[y] = (years[y] || 0) + 1 : noYear++; mediaTokens(w.medium).forEach(m => media[m] = (media[m] || 0) + 1); });
    rows.year.innerHTML = Object.keys(years).sort().reverse().map(y => chip("year", y, y, years[y])).join("") + (noYear ? chip("year", NONE, "연도 없음", noYear) : "") || `<span class="xf-note">연도가 적힌 작품이 아직 없어요</span>`;
    rows.medium.innerHTML = Object.entries(media).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko")).map(([m, n]) => chip("medium", m, m, n)).join("") || `<span class="xf-note">재료가 적힌 작품이 아직 없어요</span>`;
    allBtn.setAttribute("aria-pressed", !flt.year && !flt.medium && !qx.value.trim());
    const act = gid("xf-active"), tags = [];
    if (flt.year) tags.push(["year", "연도", flt.year === NONE ? "연도 없음" : flt.year, ""]);
    if (flt.medium) tags.push(["medium", "재료", flt.medium, ""]);
    act.hidden = !tags.length;
    act.innerHTML = tags.length ? `<b>선택한 조건</b>` + tags.map(([g, lab, val, hex]) => `<button class="xf-tag" type="button" data-g="${g}" aria-label="${lab} ${esc(val)} 조건 지우기"><em>${lab}</em>${hex ? `<i style="background:${hex}"></i>` : ""}${esc(val)}<span aria-hidden="true">×</span></button>`).join("") + (tags.length > 1 ? `<button class="xf-clear" type="button" id="xf-clear">모두 지우기</button>` : "") : "";
  }
  const yearNum = w => +String(w.year || "").match(/\d{4}/) || 0;
  function filtered() {
    const idx = new Map(WORKS.map((w, i) => [w, i]));
    let l = WORKS.filter(w =>
      (!flt.year || (flt.year === NONE ? !String(w.year || "").trim() : String(w.year || "").trim() === flt.year)) &&
      (!flt.medium || mediaTokens(w.medium).includes(flt.medium)) && workMatch(w, qx.value));
    const by = {
      order: (a, b) => idx.get(a) - idx.get(b),
      "year-desc": (a, b) => (yearNum(b) - yearNum(a)) || idx.get(a) - idx.get(b),
      "year-asc": (a, b) => ((yearNum(a) || 9999) - (yearNum(b) || 9999)) || idx.get(a) - idx.get(b),
      medium: (a, b) => String(mediaTokens(a.medium)[0] || "힣").localeCompare(String(mediaTokens(b.medium)[0] || "힣"), "ko") || idx.get(a) - idx.get(b),
      title: (a, b) => String(a.title).localeCompare(String(b.title), "ko"),
    }[sortEl.value];
    return by ? l.sort(by) : l;
  }
  function gitem(w) {
    const a = document.createElement("article"); a.className = "gitem";
    a.innerHTML = `<figure><img src="${esc(w.web || w.src)}" alt="${esc(w.title)}" loading="lazy" decoding="async"></figure><p><span class="no">No. ${String(workNo(w)).padStart(2, "0")}</span>${esc(w.title)}</p>`;
    a.querySelector("figure").addEventListener("click", () => lb.open(w, a.querySelector("figure")));
    return a;
  }
  function item(w) {
    if (view === "grid") return gitem(w);
    const a = document.createElement("article"); a.className = "work";
    a.innerHTML = `<figure><img src="${esc(w.web || w.src)}" alt="${esc(w.title)}" loading="lazy"></figure>
      <div class="cap"><span class="no">No. ${String(workNo(w)).padStart(2, "0")}</span><h3>${esc(w.title)}</h3><dl>
        ${w.size ? `<dt>크기</dt><dd>${esc(w.size)}</dd>` : ""}
        ${w.medium ? `<dt>재료</dt><dd>${esc(w.medium)}</dd>` : ""}
        ${w.year ? `<dt>연도</dt><dd>${esc(w.year)}</dd>` : ""}
      </dl></div>${w.desc ? `<p class="desc">${esc(w.desc)}</p>` : ""}`;
    a.querySelector("figure").addEventListener("click", () => lb.open(w, a.querySelector("figure")));
    io.observe(a); return a;
  }
  function render(append) {
    const part = current.slice(0, shown);
    if (!append) { list.innerHTML = ""; drawn = 0; }
    if (!current.length) list.innerHTML = `<p class="xf-empty">${WORKS.length ? "조건에 맞는 작품이 없어요. ‘ALL’을 눌러 처음으로 돌아가 보세요." : "아직 전시된 작품이 없어요."}</p>`;
    else { if (!drawn) list.innerHTML = ""; part.slice(drawn).forEach(w => list.appendChild(item(w))); drawn = part.length; }
    const f = flt.year || flt.medium || qx.value.trim();
    count.innerHTML = `총 <b>${WORKS.length}</b>점` + (f ? ` · 조건에 맞는 작품 ${current.length}점` : "") + (current.length > part.length ? ` · ${part.length}점 보는 중` : "");
    list.classList.toggle("grid", view === "grid");
    more.hidden = !!sentIO || current.length <= part.length; if (sentIO) { sentIO.unobserve(sent); sentIO.observe(sent); } more.textContent = `다음 ${Math.min(PAGE(), current.length - part.length)}점 더 보기 (남은 ${current.length - part.length}점)`;
  }
  function applyAndRender() { current = filtered(); shown = Math.max(shown, PAGE()); render(false); }
  function reset() { shown = PAGE(); current = filtered(); render(false); }
  gid("xf").addEventListener("click", e => {
    const b = e.target.closest(".xf-chip"); if (!b) return;
    const g = b.dataset.g; flt[g] = flt[g] === b.dataset.v ? "" : b.dataset.v;
    buildChips(); reset();
  });
  const clearAll = () => { flt.year = flt.medium = ""; qx.value = ""; buildChips(); reset(); };
  allBtn.addEventListener("click", clearAll);
  gid("xf-active").addEventListener("click", e => {
    if (e.target.closest("#xf-clear")) return clearAll();
    const t = e.target.closest(".xf-tag"); if (!t) return;
    flt[t.dataset.g] = ""; buildChips(); reset();
  });
  sortEl.addEventListener("change", reset);
  let qt; qx.addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { buildChips(); reset(); }, 200); });
  more.addEventListener("click", () => { shown += PAGE(); current = filtered(); render(true); });
  // 바닥 근처에 오면 다음 작품을 자동으로 이어 붙인다
  const sent = gid("xf-sentinel");
  const sentIO = "IntersectionObserver" in window ? new IntersectionObserver(es => {
    if (es[0].isIntersecting && drawn && current.length > shown) { shown += PAGE(); render(true); }
  }, { rootMargin: "900px 0px" }) : null;
  gid("xf").addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (!b || b.dataset.view === view) return;
    view = b.dataset.view; gid("xf").querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
    const y = list.getBoundingClientRect().top + scrollY; reset();
    if (scrollY > y) scrollTo(0, y - 80);
  });
  onWorks(() => { buildChips(); reset(); });
})();

/* ───────── 관리자 페이지: #admin 에서 작품 사진·캡션을 고친다 (소유자·편집자만) ───────── */
(() => {
  const sec = document.getElementById("admin"), listEl = document.getElementById("adm-list"), note = document.getElementById("adm-note");
  const addBtn = document.getElementById("adm-add"), link = document.getElementById("admin-link");
  let db = null, assets = null, canEdit = false, docs = [], unsub = null, ready = null;
  const bar = document.getElementById("adm-bar"), countEl = document.getElementById("adm-count"), hint = document.getElementById("adm-hint");
  const q = document.getElementById("adm-q"), fMedium = document.getElementById("adm-medium"), fYear = document.getElementById("adm-year");
  const fPhoto = document.getElementById("adm-photo"), fSort = document.getElementById("adm-sort");
  [q, fMedium, fYear, fPhoto, fSort].forEach(el => el.addEventListener(el === q ? "input" : "change", render));
  document.getElementById("adm-reset").addEventListener("click", () => { q.value = ""; fMedium.value = fYear.value = fPhoto.value = ""; fSort.value = "order"; render(); });
  // 크기 "53×45.5cm" → 면적, 재료 "한지에 채색, 자개" → ["한지에 채색", "자개"]
  const area = v => { const n = String(v || "").match(/[\d.]+/g); return n && n.length >= 2 ? +n[0] * +n[1] : n ? +n[0] : -1; };
  const media = v => String(v || "").split(/[,·]/).map(x => x.trim()).filter(Boolean);
  function fillSelect(sel, values) {
    const cur = sel.value;
    sel.innerHTML = `<option value="">전체</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    sel.value = values.includes(cur) ? cur : "";
  }
  function visibleDocs() {
    const term = q.value.trim().toLowerCase();
    let list = docs.map((d, i) => ({ d, i, w: d.data() }));
    list = list.filter(({ w }) =>
      (!term || [w.title, w.medium, w.desc, w.size, w.year].some(v => String(v || "").toLowerCase().includes(term))) &&
      (!fMedium.value || media(w.medium).includes(fMedium.value)) &&
      (!fYear.value || String(w.year || "") === fYear.value) &&
      (!fPhoto.value || (fPhoto.value === "yes") === !!imgSrc(w)));
    const by = {
      title: (a, b) => String(a.w.title || "").localeCompare(String(b.w.title || ""), "ko"),
      "year-desc": (a, b) => (+b.w.year || 0) - (+a.w.year || 0) || a.i - b.i,
      "year-asc": (a, b) => (+a.w.year || 9999) - (+b.w.year || 9999) || a.i - b.i,
      "size-desc": (a, b) => area(b.w.size) - area(a.w.size),
      "size-asc": (a, b) => (area(a.w.size) < 0 ? 1e9 : area(a.w.size)) - (area(b.w.size) < 0 ? 1e9 : area(b.w.size)),
      recent: (a, b) => String(b.w.createdAt || "").localeCompare(String(a.w.createdAt || "")) || b.i - a.i,
    }[fSort.value];
    if (by) list.sort(by);
    return list;
  }
  const FIELDS = [["title", "제목", "full"], ["size", "크기", ""], ["medium", "재료", ""], ["year", "연도", ""], ["desc", "설명 (선택)", "full", true]];

  async function init() {
    if (ready) return ready;
    ready = (async () => {
      db = await DB;
      const user = await window.claude?.use?.("user");
      canEdit = !!(user && await user.canEdit());
      assets = canEdit ? await window.claude.use("assets") : null;
      link.hidden = !canEdit;
    })();
    return ready;
  }
  init();

  function route() {
    const on = location.hash === "#admin";
    document.body.classList.toggle("admin", on);
    sec.hidden = !on;
    if (on) { scrollTo(0, 0); open(); }
  }
  addEventListener("hashchange", route);

  // 긴 변 1200px의 작은 JPEG를 만든다 (방문자 화면이 원본을 내려받지 않도록)
  function makeWebBlob(file) {
    return new Promise(res => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        try {
          const k = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
          c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          c.toBlob(b => { URL.revokeObjectURL(u); res(b); }, "image/jpeg", .82);
        } catch { URL.revokeObjectURL(u); res(null); }
      };
      im.onerror = () => { URL.revokeObjectURL(u); res(null); }; im.src = u;
    });
  }
  async function open() {
    note.hidden = false; note.textContent = "불러오는 중…";
    await init();
    if (!db) { note.textContent = "이 화면에서는 작품 데이터를 불러올 수 없어요. claude.ai에서 로그인한 상태로 열어 주세요."; return; }
    if (!canEdit) { note.textContent = "작품 관리는 이 갤러리의 소유자와 편집자만 할 수 있어요."; listEl.innerHTML = ""; addBtn.hidden = true; return; }
    addBtn.hidden = false;
    if (!unsub) unsub = db.collection("works").orderBy("order").onSnapshot(snap => { docs = snap.docs; render(); },
      () => { note.hidden = false; note.textContent = "작품 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요."; });
  }

  const status = (row, text, err) => { const s = row.querySelector(".adm-status"); s.textContent = text; s.classList.toggle("err", !!err); };
  const saving = new Map(); // 문서별로 한 번에 하나씩 저장
  function save(id, row, patch) {
    const prev = saving.get(id) || Promise.resolve();
    const next = prev.then(async () => {
      status(row, "저장 중…");
      try { await db.collection("works").doc(id).update(patch); status(row, "저장됨"); }
      catch (e) { status(row, "저장하지 못했어요. 다시 시도해 주세요.", true); }
    });
    saving.set(id, next); return next;
  }

  // 로그인하지 않은 방문자가 보는 공개용 목록(SNAPSHOT)과 지금 저장된 목록을 견주어, 아직 공개 쪽에 반영되지 않은 변경을 알려 준다
  const sig = w => [w.title, w.size, w.medium, w.year, w.desc || "", w.image || "", w.order, w.hidden ? 1 : 0].join("\u0001");
  function syncNotice() {
    const box = gid("adm-sync"); if (!docs.length) { box.hidden = true; return; }
    const pub = new Map(SNAPSHOT.map(w => [w.id, sig(w)])), live = new Map(docs.map(d => [d.id, sig(d.data())]));
    let changed = 0, added = 0, removed = 0;
    live.forEach((v, id) => { if (!pub.has(id)) added++; else if (pub.get(id) !== v) changed++; });
    pub.forEach((v, id) => { if (!live.has(id)) removed++; });
    const n = changed + added + removed; box.hidden = false; box.classList.toggle("warn", n > 0);
    box.innerHTML = n ? `<b>공개 페이지에 아직 반영되지 않은 변경이 ${n}건 있어요</b> (수정 ${changed} · 추가 ${added} · 삭제 ${removed}).<br>인스타그램 링크처럼 로그인하지 않고 보는 사람에게는 마지막으로 ‘공개 반영’한 목록(${SNAPSHOT.length}점)이 보여요. Claude에게 <b>“공개 페이지에 반영해줘”</b>라고 말하면 지금 저장된 내용으로 바꿔 드려요.`
      : `공개 페이지와 같은 내용이에요. 로그인하지 않고 보는 사람에게도 지금 목록 ${SNAPSHOT.length}점이 그대로 보여요.`;
  }
  let renderLater = false;
  listEl.addEventListener("focusout", () => setTimeout(() => {
    if (renderLater && !(document.activeElement && listEl.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))) render();
  }, 0));
  const grow = t => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 420) + "px"; };
  function render() {
    syncNotice();
    // 입력 중(특히 천지인·한글 조합 중)에는 목록을 다시 만들지 않는다 — 입력칸이 바뀌면 자모가 조합되지 못하고 따로 찍힌다
    const focused = document.activeElement && listEl.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== "file" ? document.activeElement : null;
    if (focused) { renderLater = true; return; }
    renderLater = false;
    const keep = null;
    fillSelect(fMedium, [...new Set(docs.flatMap(d => media(d.data().medium)))].sort((a, b) => a.localeCompare(b, "ko")));
    fillSelect(fYear, [...new Set(docs.map(d => String(d.data().year || "")).filter(Boolean))].sort().reverse());
    const shown = visibleDocs(), filtered = shown.length !== docs.length, canMove = fSort.value === "order" && !filtered;
    bar.hidden = !docs.length;
    const withPhoto = docs.filter(d => imgSrc(d.data())).length;
    countEl.innerHTML = `총 <b>${docs.length}</b>점` + (filtered ? `<span>조건에 맞는 작품 ${shown.length}점</span>` : "") +
      (withPhoto < docs.length ? `<span>사진 없는 작품 ${docs.length - withPhoto}점</span>` : "");
    hint.hidden = canMove || !docs.length;
    note.hidden = shown.length > 0;
    note.textContent = docs.length ? "조건에 맞는 작품이 없어요. 필터를 바꾸거나 ‘초기화’를 눌러 주세요." : "아직 등록된 작품이 없어요. ‘새 작품 추가’로 첫 작품을 올려 보세요.";
    listEl.innerHTML = "";
    shown.forEach(({ d, i }) => {
      const w = d.data(), src = webSrc(d.id, w);
      const row = document.createElement("article");
      row.className = "adm-item"; row.dataset.id = d.id;
      row.innerHTML = `
        <div class="adm-thumb">
          <div class="ph">${src ? "" : "사진 없음"}</div>
          <label class="btn quiet" for="file-${d.id}">사진 바꾸기</label>
          <input type="file" id="file-${d.id}" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>
        <div class="adm-fields">
          ${FIELDS.map(([k, label, cls, area]) => `<label class="${cls}">${label}${area
            ? `<textarea name="${k}" id="${k}-${d.id}"></textarea>`
            : `<input name="${k}" id="${k}-${d.id}" type="text">`}</label>`).join("")}
          <div class="adm-row">
            <div class="left">
              <span class="adm-num">${String(i + 1).padStart(2, "0")}</span>
              <button class="btn quiet" type="button" data-move="-1" ${!canMove || i === 0 ? "disabled" : ""} aria-label="앞으로">↑</button>
              <button class="btn quiet" type="button" data-move="1" ${!canMove || i === docs.length - 1 ? "disabled" : ""} aria-label="뒤로">↓</button>
              <span class="adm-status"></span>
            </div>
            <div class="right"><button class="btn danger" type="button" data-del>삭제</button></div>
          </div>
        </div>`;
      if (src) row.querySelector(".ph").style.backgroundImage = `url("${src.replace(/"/g, "%22")}")`;
      FIELDS.forEach(([k]) => {
        const el = row.querySelector(`[name=${k}]`);
        el.value = w[k] ?? "";
        let timer, composing = false;
        const commit = () => { clearTimeout(timer); if (el.value !== (w[k] ?? "")) { w[k] = el.value; save(d.id, row, { [k]: el.value }); } };
        el.addEventListener("compositionstart", () => { composing = true; clearTimeout(timer); });
        el.addEventListener("compositionend", () => { composing = false; clearTimeout(timer); timer = setTimeout(commit, 900); });
        el.addEventListener("input", e => {
          if (el.tagName === "TEXTAREA") grow(el);
          clearTimeout(timer); status(row, "입력 중…");
          if (composing || e.isComposing) return; // 조합이 끝난 뒤에 저장
          timer = setTimeout(commit, 900);
        });
        el.addEventListener("blur", () => { if (!composing) commit(); });
      });
      // 사진 바꾸기
      row.querySelector("input[type=file]").addEventListener("change", async e => {
        const file = e.target.files[0]; if (!file) return;
        if (!assets) { status(row, "이 화면에서는 사진을 올릴 수 없어요.", true); return; }
        status(row, "사진 올리는 중…");
        try {
          const up = await assets.upload(file);
          const old = w.image;
          const webBlob = await makeWebBlob(file); let webUp = null;
          if (webBlob) { try { webUp = await assets.upload(webBlob, { type: "image/jpeg" }); } catch {} }
          await save(d.id, row, { image: up.id, webId: webUp ? webUp.id : "" });
          if (w.webId && (!webUp || w.webId !== webUp.id)) assets.delete(w.webId).catch(() => {});
          if (old && old !== up.id) assets.delete(old).catch(() => {}); // 이전 사진은 이 작품만 쓰던 것
        } catch (err) {
          const msg = { too_large: "사진이 너무 커요 (20MB 이하).", unsupported_type: "JPG, PNG, WEBP, GIF 사진만 올릴 수 있어요." }[err?.code] || "사진을 올리지 못했어요. 다시 시도해 주세요.";
          status(row, msg, true);
        }
      });
      // 순서 바꾸기
      row.querySelectorAll("[data-move]").forEach(b => b.addEventListener("click", async () => {
        const j = i + +b.dataset.move, other = docs[j]; if (!other) return;
        const a = w.order ?? i, c = other.data().order ?? j;
        status(row, "순서 바꾸는 중…");
        try {
          await db.collection("works").doc(d.id).update({ order: c === a ? j : c });
          await db.collection("works").doc(other.id).update({ order: c === a ? i : a });
        } catch { status(row, "순서를 바꾸지 못했어요.", true); }
      }));
      // 삭제 (한 번 더 확인)
      const del = row.querySelector("[data-del]");
      del.addEventListener("click", () => {
        const box = del.parentElement;
        box.innerHTML = `<span class="adm-confirm">이 작품을 지울까요? <button class="btn danger" type="button" data-yes>지우기</button><button class="btn quiet" type="button" data-no>취소</button></span>`;
        box.querySelector("[data-no]").addEventListener("click", render);
        box.querySelector("[data-yes]").addEventListener("click", async () => {
          try {
            await db.collection("works").doc(d.id).delete();
            if (assets) { if (w.image) assets.delete(w.image).catch(() => {}); if (w.webId) assets.delete(w.webId).catch(() => {}); }
          } catch { status(row, "지우지 못했어요. 다시 시도해 주세요.", true); }
        });
      });
      listEl.appendChild(row);
      grow(row.querySelector("textarea"));
    });
  }

  addBtn.addEventListener("click", async () => {
    const order = docs.reduce((m, d) => Math.max(m, d.data().order ?? 0), 0) + 1;
    addBtn.disabled = true;
    try {
      q.value = ""; fMedium.value = fYear.value = fPhoto.value = ""; // 새 작품이 바로 보이도록
      const ref = await db.collection("works").add({ title: "새 작품", size: "", medium: "", year: "", desc: "", order, createdAt: new Date().toISOString() });
      setTimeout(() => { const el = document.getElementById("title-" + ref.id); if (el) { el.focus(); el.select(); } }, 300);
    } catch (e) {
      note.hidden = false; note.textContent = e?.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 쓰지 않는 작품을 지운 뒤 다시 시도해 주세요." : "작품을 추가하지 못했어요. 다시 시도해 주세요.";
    } finally { addBtn.disabled = false; }
  });

  route();
})();

/* ───────── 계단과 아이 ───────── */
(() => {
  const wrap = document.getElementById("stairs"), svg = document.getElementById("steps"), walker = document.getElementById("walker");
  const PER = 4;           // 한 층계참당 계단 수
  let N, pts = [], cur = 0, target = 0, timer = null, facing = 1;

  function build() {
    if (!wrap.clientWidth) return; // 모바일에서는 하단 바를 쓴다
    const W = wrap.clientWidth, H = wrap.clientHeight, small = W < 80;
    N = small ? 12 : 16;
    const run = (W - 8) / PER, rise = H / N;
    let d = "", x = 4, y = 0, dir = 1;
    pts = [];
    d = `M${x} ${y}`;
    for (let k = 0; k <= N; k++) {
      pts.push({ x: x + dir * run / 2, y, dir });
      if (k === N) { d += ` L${x + dir * run} ${y}`; break; }
      const nx = x + dir * run; d += ` L${nx} ${y} L${nx} ${y + rise}`;
      x = nx; y += rise;
      if ((k + 1) % PER === 0) dir = -dir; // 층계참에서 방향을 바꾼다
    }
    svg.innerHTML = `<path d="${d}"/>`;
    wrap.querySelectorAll(".hit").forEach(h => h.remove());
    pts.forEach((p, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "hit";
      b.style.left = (p.x - run / 2 - (p.dir < 0 ? 0 : 0)) + "px"; b.style.width = run + "px"; b.style.top = (p.y - 20) + "px";
      b.setAttribute("aria-label", `${Math.round(k / N * 100)}% 위치로 이동`);
      b.addEventListener("click", () => scrollTo({ top: k / N * (document.documentElement.scrollHeight - innerHeight), behavior: "smooth" }));
      wrap.appendChild(b);
    });
    place(true);
  }
  function place(instant) {
    if (!pts.length) return;
    const p = pts[cur], ww = walker.offsetWidth, wh = walker.offsetHeight;
    walker.style.transition = instant ? "none" : "";
    walker.style.transform = `translate(${p.x - ww / 2}px, ${p.y - wh}px) scaleX(${facing})`;
  }
  function step() {
    if (cur === target) { walker.classList.remove("walking"); timer = null; return; }
    const down = target > cur;
    const from = pts[cur];
    cur += down ? 1 : -1;
    // 내려갈 때는 그 층의 진행 방향, 오를 때는 반대 방향을 바라본다
    const dir = down ? from.dir : pts[cur].dir;
    facing = down ? dir : -dir;
    place(false);
    timer = setTimeout(step, reduce ? 0 : 230);
  }
  function update() {
    if (!pts.length) return;
    const max = document.documentElement.scrollHeight - innerHeight;
    target = Math.round(Math.min(1, Math.max(0, scrollY / (max || 1))) * N);
    if (!timer && target !== cur) { walker.classList.add("walking"); step(); }
  }
  build();
  addEventListener("resize", () => { build(); update(); });
  addEventListener("scroll", update, { passive: true });
  update();
})();
/* ───────── 모바일 하단 바: 바로가기 + 읽은 위치 표시 ───────── */
(() => {
  const dock = document.getElementById("dock"), bar = document.getElementById("dock-bar"), stairs = document.getElementById("stairs");
  function update() {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${Math.min(1, Math.max(0, scrollY / (max || 1)))})`;
    let cur = "";
    ["browse", "room"].forEach(id => { const e = document.getElementById(id); if (e && e.getBoundingClientRect().top < innerHeight * .5) cur = id; });
    dock.querySelectorAll("[data-to]").forEach(b => b.setAttribute("aria-current", b.dataset.to === cur));
  }
  dock.querySelector(".dock-nav").addEventListener("click", e => {
    const b = e.target.closest("[data-to]"); if (!b) return;
    const to = b.dataset.to === "top" ? 0 : document.getElementById(b.dataset.to).getBoundingClientRect().top + scrollY - 8;
    scrollTo({ top: to, behavior: reduce ? "auto" : "smooth" });
  });
  const sync = () => dock.classList.toggle("show", stairs.classList.contains("show"));
  new MutationObserver(sync).observe(stairs, { attributes: true, attributeFilter: ["class"] }); sync();
  addEventListener("scroll", update, { passive: true }); addEventListener("resize", update); update();
})();
